					if(p.get("v")===v)return;
					p.set("v",v);
					history.replaceState(null,"",location.pathname+"?"+p.toString()+location.hash);

		<script>
		(function () {
			var overlay = document.getElementById('cxd-input-overlay');
			var titleEl = document.getElementById('cxd-input-title');
			var field = document.getElementById('cxd-input-field');
			var okBtn = document.getElementById('cxd-input-ok');
			var cancelBtn = document.getElementById('cxd-input-cancel');
			window.__cxdInput = { open: false, done: false, value: '', cancelled: false };
			function finish(ok) {
				window.__cxdInput.open = false;
				window.__cxdInput.done = true;
				window.__cxdInput.cancelled = !ok;
				window.__cxdInput.value = ok ? String(field.value || '') : '';
				overlay.classList.remove('open');
				overlay.setAttribute('aria-hidden', 'true');
				try { field.blur(); } catch (e) {}
				try {
					var c = document.getElementById('canvas');
					if (c) c.focus();
				} catch (e2) {}
			}
			window.chuxindiaoOpenInput = function (title, value, secret) {
				window.__cxdInput = { open: true, done: false, value: '', cancelled: false };
				titleEl.textContent = title || '请输入';
				field.type = secret ? 'password' : 'text';
				field.autocomplete = secret ? 'current-password' : 'username';
				field.value = value || '';
				overlay.classList.add('open');
				overlay.setAttribute('aria-hidden', 'false');
				// 延后 focus，保证在用户手势链路里，且盖住 Godot canvas
				setTimeout(function () {
					try {
						field.focus({ preventScroll: false });
						field.click();
						if (field.setSelectionRange) {
							var n = field.value.length;
							field.setSelectionRange(n, n);
						}
					} catch (e) {
						try { field.focus(); } catch (e2) {}
					}
				}, 30);
				return true;
			};
			window.chuxindiaoPollInput = function () {
				if (!window.__cxdInput.done) return '';
				if (window.__cxdInput.cancelled) return '__CXD_CANCEL__';
				return String(window.__cxdInput.value);
			};
			window.chuxindiaoInputBusy = function () {
				return !!(window.__cxdInput && window.__cxdInput.open && !window.__cxdInput.done);
			};
			okBtn.addEventListener('click', function (ev) {
				ev.preventDefault();
				finish(true);
			});
			cancelBtn.addEventListener('click', function (ev) {
				ev.preventDefault();
				finish(false);
			});
			field.addEventListener('keydown', function (ev) {
				if (ev.key === 'Enter') {
					ev.preventDefault();
					finish(true);
				} else if (ev.key === 'Escape') {
					ev.preventDefault();
					finish(false);
				}
			});
			// 点遮罩空白不关闭，避免误触；只通过按钮结束
		})();
		</script>

	function setStatusNotice(text) {
