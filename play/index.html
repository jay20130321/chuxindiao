				if(!v||String(v).charAt(0)==="$")return;
				v=String(v);

					var p=new URLSearchParams(location.search);
					if(p.get("v")===v && p.get("fresh")==="1")return;
					p.set("v",v);

					p.set("_",String(Date.now()));
					location.replace(location.pathname+"?"+p.toString()+location.hash);
				}catch(e){}
			}
			function syncV(v, hard){
				if(!v||String(v).charAt(0)==="$")return;
				v=String(v);
				try{
					var p=new URLSearchParams(location.search);
					if(p.get("v")===v){
						if(hard)goLatest(v);
						return;
					}
					if(hard){ goLatest(v); return; }
					p.set("v",v);
					history.replaceState(null,"",location.pathname+"?"+p.toString()+location.hash);
				}catch(e){}

				.catch(function(){});

		<script>
		(function () {
			var overlay = document.getElementById('cxd-input-overlay');
			var titleEl = document.getElementById('cxd-input-title');
			var field = document.getElementById('cxd-input-field');
			var okBtn = document.getElementById('cxd-input-ok');
			var cancelBtn = document.getElementById('cxd-input-cancel');
			window.__cxdInput = { open: false, done: false, value: '', cancelled: false };
			function finish(ok) {
				window.__cxdInput.open = false;
				window.__cxdInput.done = true;
				window.__cxdInput.cancelled = !ok;
				window.__cxdInput.value = ok ? String(field.value || '') : '';
				overlay.classList.remove('open');
				overlay.setAttribute('aria-hidden', 'true');
				try { field.blur(); } catch (e) {}
				try {
					var c = document.getElementById('canvas');
					if (c) c.focus();
				} catch (e2) {}
			}
			window.chuxindiaoOpenInput = function (title, value, secret) {
				window.__cxdInput = { open: true, done: false, value: '', cancelled: false };
				titleEl.textContent = title || '请输入';
				field.type = secret ? 'password' : 'text';
				field.autocomplete = secret ? 'current-password' : 'username';
				field.value = value || '';
				overlay.classList.add('open');
				overlay.setAttribute('aria-hidden', 'false');
				// 延后 focus，保证在用户手势链路里，且盖住 Godot canvas
				setTimeout(function () {
					try {
						field.focus({ preventScroll: false });
						field.click();
						if (field.setSelectionRange) {
							var n = field.value.length;
							field.setSelectionRange(n, n);
						}
					} catch (e) {
						try { field.focus(); } catch (e2) {}
					}
				}, 30);
				return true;
			};
			window.chuxindiaoPollInput = function () {
				if (!window.__cxdInput.done) return '';
				if (window.__cxdInput.cancelled) return '__CXD_CANCEL__';
				return String(window.__cxdInput.value);
			};
			window.chuxindiaoInputBusy = function () {
				return !!(window.__cxdInput && window.__cxdInput.open && !window.__cxdInput.done);
			};
			okBtn.addEventListener('click', function (ev) {
				ev.preventDefault();
				finish(true);
			});
			cancelBtn.addEventListener('click', function (ev) {
				ev.preventDefault();
				finish(false);
			});
			field.addEventListener('keydown', function (ev) {
				if (ev.key === 'Enter') {
					ev.preventDefault();
					finish(true);
				} else if (ev.key === 'Escape') {
					ev.preventDefault();
					finish(false);
				}
			});
			// 点遮罩空白不关闭，避免误触；只通过按钮结束
		})();

				var sizes = GODOT_CONFIG.fileSizes || {};
				var next = {};
				Object.keys(sizes).forEach(function (k) {
					if (k.indexOf('pack-') !== 0 && k !== 'index.pck') {
						next[k] = sizes[k];
					}
				});
				if (meta.size) {
					next[pack] = meta.size;
				} else if (sizes[pack]) {
					next[pack] = sizes[pack];
				}
				GODOT_CONFIG.fileSizes = next;
				if (meta.v && typeof window.__chuxindiaoSyncV === 'function') {
					window.__chuxindiaoSyncV(String(meta.v));
				}
				if (loadPct) {
					loadPct.textContent = '同步最新包 ' + (meta.v || pack) + '…';
				}
				return true;
			});
	}

	var booted = false;
	var gateShown = false;
	function bootEngine() {
		// 老 iOS：先提示再让用户确认，避免白屏/难懂的 WASM 报错
		if (!gateShown && window.__cxdLegacyIOS && window.__cxdWasmSimd === false) {
			gateShown = true;
			showLegacyIOSGate(function () { bootEngine(); });
			return;
		}
		if (booted) {
			return;
		}
		booted = true;
		const engine = new Engine(GODOT_CONFIG);
		const missing = Engine.getMissingFeatures({
			threads: GODOT_THREADS_ENABLED,
		});

		if (missing.length !== 0) {
			if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
				let serviceWorkerRegistrationPromise;
				try {
					serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
				} catch (err) {
					serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
				}
				Promise.race([
					serviceWorkerRegistrationPromise.then((registration) => {
						if (registration != null) {
							return Promise.reject(new Error('Service worker already exists.'));
						}
						return registration;
					}).then(() => engine.installServiceWorker()),
					new Promise((resolve) => {
						setTimeout(() => resolve(), 2000);
					}),
				]).then(() => {
					window.location.reload();
				}).catch((err) => {
					console.error('Error while registering service worker:', err);
				});
			} else {
				const missingMsg = '当前浏览器缺必要能力，无法运行：\n';
				displayFailureNotice(missingMsg + missing.join('\n'));
			}
			return;
		}

		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					const p = Math.max(0, Math.min(100, Math.round(current / total * 100)));
					loadBar.classList.remove('indeterminate');
					loadBar.style.width = p + '%';
					if (p >= 100) {
						sawFull = true;
						loadPct.textContent = '正在启动…';
						armStallWatch();
					} else {
						loadPct.textContent = '加载中 ' + p + '%';
					}
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					loadBar.classList.add('indeterminate');
					loadPct.textContent = '加载中…';
				}
			},
		}).then(() => {
			engineReady = true;
			if (stallTimer) {
				window.clearTimeout(stallTimer);
			}
			if (!serverReady && loadPct) {
				loadPct.textContent = '游戏已就绪，正在连接联机…';
			}
			maybeHide();
		}, displayFailureNotice);
	}

	setStatusMode('progress');
	if (loadPct) {
		loadPct.textContent = '检查版本…';
	}
	var versionTimer = window.setTimeout(function () {
		bootEngine();
	}, 3500);
	// Pages CDN 常缓存旧 version.json；同时问 GitHub 原始文件，取更新的那个
	function fetchJson(url) {
		return fetch(url, { cache: 'no-store' })
			.then(function (r) { return r.ok ? r.json() : null; })
			.catch(function () { return null; });
	}
	function metaStamp(m) {
		if (!m) return '';
		if (m.v) return String(m.v);
		var p = String(m.pack || '');
		var mm = p.match(/(\d{10,})/);
		return mm ? mm[1] : '';
	}
	function newerMeta(a, b) {
		if (!a) return b;
		if (!b) return a;
		return metaStamp(b) > metaStamp(a) ? b : a;
	}
	// 优先本站 version.json；GitHub 原文件仅作参考，且必须本站 pack 已 200 才切换，
	// 避免 CDN 未同步时跳到不存在的包导致白屏/出不了钓。
	Promise.all([
		fetchJson('version.json?t=' + Date.now()),
		fetchJson('../version.json?t=' + Date.now()),
		fetchJson('https://raw.githubusercontent.com/jay20130321/chuxindiao/main/version.json?t=' + Date.now()),
		fetchJson('https://raw.githubusercontent.com/jay20130321/chuxindiao/main/play/version.json?t=' + Date.now()),
	]).then(function (pair) {
		window.clearTimeout(versionTimer);
		var localMeta = newerMeta(pair[0], pair[1]);
		var remoteMeta = newerMeta(pair[2], pair[3]);
		var pickAndBoot = function (j) {
			var after = function (switched) {
				if (switched && j && j.v) {
					var bakedEl = '';
					var urlV = '';
					try {
						var bakedMatch = (document.head && document.head.innerHTML || '').match(/baked="(\d+)"/);
						if (bakedMatch) bakedEl = bakedMatch[1];
						urlV = new URLSearchParams(location.search).get('v') || '';
					} catch (e1) {}
					var latest = String(j.v);
					var staleHtml = bakedEl && latest !== String(bakedEl);
					var staleUrl = urlV && /^\d+$/.test(urlV) && urlV < latest;
					if (staleHtml || staleUrl) {
						var key = 'cxd_reload_' + latest;
						try {
							if (!sessionStorage.getItem(key)) {
								sessionStorage.setItem(key, '1');
								try {
									if (window.caches && caches.keys) {
										caches.keys().then(function (ks) {
											ks.forEach(function (k) { caches.delete(k); });
										});
									}
								} catch (e3) {}
								location.replace(location.pathname + '?v=' + encodeURIComponent(latest) + '&fresh=1&_=' + Date.now());
								return;
							}
						} catch (e2) {}
					}
				}
				bootEngine();
			};
			if (j) {
				Promise.resolve(applyLatestPack(j)).then(after).catch(function () { bootEngine(); });
			} else {
				bootEngine();
			}
		};
		var remoteNewer = remoteMeta && metaStamp(remoteMeta) > metaStamp(localMeta || {});
		if (remoteNewer && remoteMeta && remoteMeta.pack) {
			fetch(String(remoteMeta.pack) + '?t=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
				.then(function (r) { return r.ok; })
				.catch(function () { return false; })
				.then(function (ok) {
					pickAndBoot(ok ? remoteMeta : (localMeta || remoteMeta));
				});
		} else {
			pickAndBoot(localMeta || remoteMeta);
		}
	}).catch(function () {
		window.clearTimeout(versionTimer);
		bootEngine();
	});
}());
		</script>
	</body>
