<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>楚新钓 · 万钧江湖</title>
  <meta name="description" content="楚新钓独立站：拉力垂钓、手机操控、世界聊天与好友同钓。" />
  <script>
  // 根目录曾误放整包游戏；带旧 ?v= 书签的人直接送进 /play/ 并清缓存
  !function () {
    try {
      var p = new URLSearchParams(location.search);
      var goPlay = p.has("v") || p.get("fresh") === "1" || p.get("ok") === "1" || p.get("purge") === "1";
      if (!goPlay) return;
      var q = new URLSearchParams();
      if (p.get("v")) q.set("v", p.get("v"));
      q.set("fresh", "1");
      q.set("purge", "1");
      q.set("_", String(Date.now()));
      location.replace((location.pathname.replace(/\/?$/, "/") + "play/?" + q.toString()).replace("/play/play/", "/play/"));
    } catch (e) {}
  }();
  </script>
  <style>
    :root { --bg:#07141c; --fg:#e8f0f5; --accent:#d4a84b; --card:#0e2430; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
      font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
    .wrap { min-height:100%; display:flex; flex-direction:column; }
    header { padding:1rem 1.25rem; display:flex; flex-wrap:wrap; gap:.75rem; align-items:center;
      justify-content:space-between; border-bottom:1px solid #1a3344; background:linear-gradient(180deg,#0c1e28,#07141c); }
    header h1 { margin:0; font-size:1.25rem; letter-spacing:.04em; color:var(--accent); font-weight:600; }
    header p { margin:0; opacity:.8; font-size:.85rem; }
    .actions { display:flex; gap:.5rem; flex-wrap:wrap; }
    a.btn, button.btn { appearance:none; border:0; cursor:pointer; text-decoration:none;
      background:var(--accent); color:#1a1205; font-weight:700; padding:.55rem 1rem; border-radius:8px; font-size:.95rem; }
    a.btn.ghost { background:transparent; color:var(--fg); border:1px solid #3a5566; }
    main { flex:1; display:flex; flex-direction:column; }
    #gameFrame { flex:1; width:100%; border:0; min-height:70vh; background:#000; }
    footer { padding:.75rem 1.25rem; font-size:.75rem; opacity:.65; border-top:1px solid #1a3344; }
    .note { max-width:720px; margin:0 auto; padding:1rem 1.25rem; color:#b7c6d0; font-size:.9rem; line-height:1.5; }
    .share { max-width:720px; margin:0 auto 0.5rem; padding:0 1.25rem 1rem; display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
    .share label { font-size:.85rem; color:var(--accent); white-space:nowrap; }
    .share input { flex:1; min-width:180px; background:#0a1a22; border:1px solid #3a5566; color:var(--fg);
      border-radius:8px; padding:.55rem .75rem; font-size:.85rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>楚新钓 · 万钧江湖</h1>
        <p>独立站 · 手机/电脑 · 世界聊天 · 邀请好友同钓</p>
      </div>
      <div class="actions">
        <a class="btn" id="playBtn" href="./play/?fresh=1&purge=1">立即开玩</a>
        <a class="btn ghost" href="./play/?fresh=1&purge=1" target="_blank" rel="noopener">新窗口</a>
      </div>
    </header>
    <p class="note">请从 <strong style="color:var(--accent)">/play/</strong> 进入游戏。若卡住请点「强制刷新」。布局页会显示包号，需为最新号。</p>
    <div class="share">
      <label for="shareUrl">网页版网址</label>
      <input id="shareUrl" type="text" readonly value="" />
      <button type="button" class="btn" id="copyUrlBtn">复制网址</button>
      <button type="button" class="btn ghost" id="hardRefreshBtn">强制刷新</button>
    </div>
    <main>
      <iframe id="gameFrame" title="楚新钓游戏" src="about:blank" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
    </main>
    <footer>© 楚新钓独立站 · 非第三方游戏聚合平台</footer>
  </div>
  <script>
    (function () {
      var input = document.getElementById("shareUrl");
      var btn = document.getElementById("copyUrlBtn");
      var hardBtn = document.getElementById("hardRefreshBtn");
      var frame = document.getElementById("gameFrame");
      var playBtn = document.getElementById("playBtn");
      function playUrl(v) {
        var q = "fresh=1&purge=1&ok=1&_=" + Date.now();
        if (v) q = "v=" + encodeURIComponent(v) + "&" + q;
        return location.origin.replace(/\/$/, "") + location.pathname.replace(/\/?$/, "/") + "play/?" + q;
      }
      function apply(v) {
        var url = playUrl(v);
        input.value = url;
        var qs = url.split("?")[1] || "fresh=1&purge=1";
        frame.src = "./play/?" + qs;
        if (playBtn) playBtn.href = "./play/?" + qs;
      }
      apply("");
      function pickV(arr) {
        var best = "";
        arr.forEach(function (j) {
          if (j && j.v && String(j.v) > best) best = String(j.v);
        });
        return best;
      }
      Promise.all([
        fetch("./version.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
        fetch("./play/version.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
        fetch("https://raw.githubusercontent.com/jay20130321/chuxindiao/main/play/version.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
      ]).then(function (arr) {
        var v = pickV(arr);
        if (v) apply(v);
      });
      function copy() {
        input.focus();
        input.select();
        var ok = false;
        var url = input.value;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(function () { ok = true; }).catch(function () {});
        }
        try { ok = document.execCommand("copy") || ok; } catch (e) {}
        btn.textContent = ok || document.getSelection().toString() === url ? "已复制" : "请手动复制";
        setTimeout(function () { btn.textContent = "复制网址"; }, 1600);
      }
      btn.addEventListener("click", copy);
      hardBtn.addEventListener("click", function () {
        Promise.all([
          fetch("./play/version.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
          fetch("https://raw.githubusercontent.com/jay20130321/chuxindiao/main/play/version.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
        ]).then(function (arr) {
          var v = pickV(arr);
          location.replace(playUrl(v));
        }).catch(function () { location.replace(playUrl("")); });
      });
      input.addEventListener("focus", function () { input.select(); });
    })();
  </script>
</body>
</html>
