<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>楚新钓 · 万钧江湖</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #f4efe4;
	background-color: #071018;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	background: #071018;
	overflow: hidden;
	font-family: "PingFang SC", "Noto Sans SC", sans-serif;
}

#status-splash,
#status-progress {
	position: absolute;
	width: 1px;
	height: 1px;
	opacity: 0;
	pointer-events: none;
}

#load-copy {
	text-align: center;
}

.track {
	width: min(280px, 70vw);
	height: 3px;
	margin: 0 auto;
	background: rgba(244, 239, 228, 0.12);
	overflow: hidden;
}

#load-bar {
	width: 0%;
	height: 100%;
	background: linear-gradient(90deg, #8d6730, #f0d48a);
	transition: width 0.25s ease;
}

#load-bar.indeterminate {
	width: 35%;
}

#load-pct {
	margin-top: 0.7rem;
	font-family: "PingFang SC", sans-serif;
	font-size: 0.78rem;
	letter-spacing: 0.18em;
	color: rgba(232, 220, 196, 0.66);
}

#status-notice {
	display: none;
	background-color: rgba(12, 22, 30, 0.92);
	border-radius: 0.5rem;
	border: 1px solid rgba(212, 168, 75, 0.45);
	color: #f4efe4;
	font-family: "PingFang SC", sans-serif;
	line-height: 1.4;
	margin: 1rem 2rem 0;
	padding: 1rem;
	text-align: center;
	z-index: 2;
	max-width: 28rem;
}

		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<div id="load-copy">
				<div class="track"><div id="load-bar" class="indeterminate"></div></div>
				<div id="load-pct">加载中…</div>
			</div>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":52214248,"index.wasm":37685705},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const loadBar = document.getElementById('load-bar');
	const loadPct = document.getElementById('load-pct');

	let initializing = true;
	let statusMode = '';
	let engineReady = false;
	let serverReady = false;

	function maybeHide() {
		if (engineReady && serverReady) {
			setStatusMode('hidden');
		}
	}

	window.chuxindiaoSetLoad = function (text) {
		if (!initializing || !loadPct) {
			return;
		}
		loadPct.textContent = text || '加载中…';
	};

	window.chuxindiaoFinishLoad = function () {
		serverReady = true;
		if (loadBar) {
			loadBar.classList.remove('indeterminate');
			loadBar.style.width = '100%';
		}
		maybeHide();
	};

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					const p = Math.max(0, Math.min(100, Math.round(current / total * 100)));
					loadBar.classList.remove('indeterminate');
					loadBar.style.width = p + '%';
					loadPct.textContent = '加载中 ' + p + '%';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					loadBar.classList.add('indeterminate');
					loadPct.textContent = '加载中…';
				}
			},
		}).then(() => {
			engineReady = true;
			if (!serverReady && loadPct) {
				loadPct.textContent = '正在连接服务器…';
			}
			maybeHide();
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
